set_effect:
  target:
    entity:
      integration: meettwo_led
      domain: light
  fields:
    effect:
      required: true
      example: fade
      selector:
        select:
          translation_key: effect
          options:
            - "off"
            - blink
            - strobe
            - breathe
            - rainbow
            - cycle
            - fade
    color:
      example: "#FF8800"
      selector:
        text:
    colors:
      example: "red, blue, #00FF00"
      selector:
        text:
          multiple: true
    speed:
      example: 2000
      selector:
        number:
          min: 50
          max: 600000
          step: 50
          unit_of_measurement: ms
          mode: box
    brightness_pct:
      example: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"